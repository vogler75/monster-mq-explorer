name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            target: --mac
            artifact: desktop-macos
            files: release/*.dmg
          - name: Windows Setup
            os: windows-latest
            target: --win
            artifact: desktop-windows
            files: release/*.exe
          - name: Linux AppImage + deb
            os: ubuntu-latest
            target: --linux
            artifact: desktop-linux
            files: |
              release/*.AppImage
              release/*.deb
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scripts/set-version.cjs takes the version from the last tag

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Setup Python (make.py)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build ${{ matrix.name }}
        run: python make.py build ${{ matrix.target }}
        env:
          # no signing certificates: Windows/Linux unsigned, macOS ad-hoc signed (mac.identity "-" in package.json)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: MonsterMQ-Explorer ${{ github.ref_name }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
